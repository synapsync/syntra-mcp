syntax = "proto3";

package syntra.v1;

import "google/protobuf/timestamp.proto";

option go_package = "syntra.local/mcp/gen/syntra/v1;syntrav1";

// Sprint 3 wire freeze only: validation/authorization/transactions are required by
// docs/API-CONTRACT.md, not implemented by these declarations. All 25 RPCs are
// protected. No publication permission authorizes command execution.

// ProjectService uses current workspace authorization on every request and retry.
service ProjectService {
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse);
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  rpc UpdateProject(UpdateProjectRequest) returns (UpdateProjectResponse);
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse);
}

// ProjectTeamService uses current workspace authorization on every request and retry.
// A project inherits active members of its assigned workspace teams, subject to
// explicit exclusions for each project and team.
service ProjectTeamService {
  rpc ListProjectTeams(ListProjectTeamsRequest) returns (ListProjectTeamsResponse);
  rpc SetProjectTeam(SetProjectTeamRequest) returns (SetProjectTeamResponse);
  rpc RemoveProjectTeam(RemoveProjectTeamRequest) returns (RemoveProjectTeamResponse);
}

// ThreadService uses current workspace authorization on every request and retry.
service ThreadService {
  rpc ListThreads(ListThreadsRequest) returns (ListThreadsResponse);
  rpc GetThread(GetThreadRequest) returns (GetThreadResponse);
  rpc CreateThread(CreateThreadRequest) returns (CreateThreadResponse);
  rpc UpdateThread(UpdateThreadRequest) returns (UpdateThreadResponse);
  rpc AssignThread(AssignThreadRequest) returns (AssignThreadResponse);
  rpc CloseThread(CloseThreadRequest) returns (CloseThreadResponse);
  rpc ReopenThread(ReopenThreadRequest) returns (ReopenThreadResponse);
}

// MessageService uses current workspace authorization on every request and retry.
service MessageService {
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);
  rpc SavePreparedMessage(SavePreparedMessageRequest) returns (SavePreparedMessageResponse);
  rpc PublishMessage(PublishMessageRequest) returns (PublishMessageResponse);
  rpc DiscardPreparedMessage(DiscardPreparedMessageRequest) returns (DiscardPreparedMessageResponse);
  rpc MarkRead(MarkReadRequest) returns (MarkReadResponse);
  rpc MarkReviewed(MarkReviewedRequest) returns (MarkReviewedResponse);
}

// InboxService uses current workspace authorization on every request and retry.
service InboxService {
  rpc ListInboxItems(ListInboxItemsRequest) returns (ListInboxItemsResponse);
}

// ActivityService uses current workspace authorization on every request and retry.
service ActivityService {
  rpc ListThreadEvents(ListThreadEventsRequest) returns (ListThreadEventsResponse);
}

// DashboardService uses current workspace authorization on every request and retry.
service DashboardService {
  rpc GetOverview(GetOverviewRequest) returns (GetOverviewResponse);
}

enum ThreadState {
  THREAD_STATE_UNSPECIFIED = 0;
  THREAD_STATE_PENDING = 1;
  THREAD_STATE_OPEN = 2;
  THREAD_STATE_CLOSED = 3;
}

enum ThreadVisibility {
  THREAD_VISIBILITY_UNSPECIFIED = 0;
  THREAD_VISIBILITY_PUBLISHED = 1;
  THREAD_VISIBILITY_OWN_PREPARED = 2;
}

enum MessageView {
  MESSAGE_VIEW_UNSPECIFIED = 0;
  MESSAGE_VIEW_PUBLISHED = 1;
  MESSAGE_VIEW_OWN_PREPARED = 2;
}

// InboxView separates private preparation, chronological waiting and review.
enum InboxView {
  INBOX_VIEW_UNSPECIFIED = 0;
  INBOX_VIEW_OWN_PREPARED = 1;
  INBOX_VIEW_AWAITING_REPLY = 2;
  INBOX_VIEW_PENDING_REVIEW = 3;
}

enum ClosureKind {
  CLOSURE_KIND_UNSPECIFIED = 0;
  CLOSURE_KIND_VALIDATED = 1;
  CLOSURE_KIND_WITHOUT_VALIDATION = 2;
}

enum ThreadEventKind {
  THREAD_EVENT_KIND_UNSPECIFIED = 0;
  THREAD_EVENT_KIND_THREAD_PUBLISHED = 1;
  THREAD_EVENT_KIND_THREAD_UPDATED = 2;
  THREAD_EVENT_KIND_THREAD_ASSIGNED = 3;
  THREAD_EVENT_KIND_MESSAGE_PUBLISHED = 4;
  THREAD_EVENT_KIND_MESSAGE_READ = 5;
  THREAD_EVENT_KIND_MESSAGE_REVIEWED = 6;
  THREAD_EVENT_KIND_THREAD_CLOSED = 8;
  THREAD_EVENT_KIND_THREAD_REOPENED = 9;
}

// Workspace catalog metadata; writes require current ADMIN. Names are 1..120 scalars/480 bytes, descriptions 0..2000 scalars/8000 bytes.
message Project {
  string id = 1;
  // Canonical lowercase non-nil UUID; all resource references must bind to this current workspace.
  string workspace_id = 2;
  string name = 3;
  string description = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  // Opaque concurrency token: 43 canonical unpadded base64url characters, 32 random bytes; never display as a version.
  string revision = 7;
  // Computed authorized counts exclude every pending thread; not revision inputs.
  uint64 team_count = 8;
  uint64 published_thread_count = 9;
  uint64 open_thread_count = 10;
  uint64 closed_thread_count = 12;
}

// A workspace team assigned to a project, with the people of that team who work on this project.
message ProjectTeam {
  // Canonical lowercase non-nil UUID; all resource references must bind to this current workspace.
  string workspace_id = 1;
  string project_id = 2;
  string team_id = 3;
  string team_name = 4;
  bool team_archived = 5;
  // The project roster for this team, in stable display-name order.
  repeated ProjectTeamMember members = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  // Opaque concurrency token: 43 canonical unpadded base64url characters, 32 random bytes; never display as a version.
  string revision = 9;
  // Persisted exclusions, including people who left the team. Returned to administrators only.
  repeated string excluded_user_ids = 10;
}

// One effective roster entry. The server sets active for every returned member.
message ProjectTeamMember {
  string user_id = 1;
  string display_name = 2;
  bool active = 3;
}

// Private to creator while private, workspace-visible after atomic first publication. The opaque revision is internal concurrency data, never a public version label.
message Thread {
  string id = 1;
  // Canonical lowercase non-nil UUID; all resource references must bind to this current workspace.
  string workspace_id = 2;
  string project_id = 3;
  // The former catalog entry (module, then area) was removed: a thread belongs to its project.
  string creator_user_id = 5;
  string assignee_user_id = 6;
  string title = 7;
  ThreadState state = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  google.protobuf.Timestamp published_at = 12;
  // Opaque concurrency token: 43 canonical unpadded base64url characters, 32 random bytes; never display as a version.
  string revision = 13;
  ClosureKind closure_kind = 16;
  optional string closed_by_user_id = 17;
  google.protobuf.Timestamp closed_at = 18;
  string closure_reason = 19;
  // Display-only preview, filled by ListThreads only (empty everywhere else): the first 240 Unicode scalar values of the
  // summary of the latest published message (published visibility) or of the caller's own current prepared message (own-prepared
  // visibility). It carries no more authority than the message itself and is never a substitute for reading the message.
  string summary_preview = 20;
}

// Author-private editable content, including against shared threads. Prepared existence/content is hidden from everyone else, including admins.
message PreparedMessage {
  string id = 1;
  // Canonical lowercase non-nil UUID; all resource references must bind to this current workspace.
  string workspace_id = 2;
  string thread_id = 3;
  // Server-derived application user UUID. Never accepted from a client request.
  string author_user_id = 4;
  // Exactly one explicit application user UUID; must be an active enabled member at save/publication.
  string recipient_user_id = 5;
  // UI label Resumen. Prepared: 0..2000 scalars/8000 bytes; publication requires nonblank. Preserve exact UTF-8.
  string summary = 6;
  // Free-form Markdown, 0..65536 UTF-8 bytes in prepared messages; publication requires nonblank. Preserve exact bytes, no template/normalization.
  string context_markdown = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  // Opaque concurrency token: 43 canonical unpadded base64url characters, 32 random bytes; never display as a version.
  string revision = 10;
  bool initial = 11;
}

// Immutable exact published content and server-derived author. Receipt is separate per message/recipient; no global reviewed flag.
message PublishedMessage {
  string id = 1;
  // Canonical lowercase non-nil UUID; all resource references must bind to this current workspace.
  string workspace_id = 2;
  string thread_id = 3;
  // Server-derived application user UUID. Never accepted from a client request.
  string author_user_id = 4;
  // Exactly one explicit application user UUID; must be an active enabled member at save/publication.
  string recipient_user_id = 5;
  // UI label Resumen. Prepared: 0..2000 scalars/8000 bytes; publication requires nonblank. Preserve exact UTF-8.
  string summary = 6;
  // Free-form Markdown, 0..65536 UTF-8 bytes in prepared messages; publication requires nonblank. Preserve exact bytes, no template/normalization.
  string context_markdown = 7;
  google.protobuf.Timestamp published_at = 8;
  RecipientReceipt receipt = 9;
}

// Only the authenticated exact recipient may set these independent facts. Review requires an existing read, never auto-reads.
message RecipientReceipt {
  string message_id = 1;
  // Exactly one explicit application user UUID; must be an active enabled member at save/publication.
  string recipient_user_id = 2;
  google.protobuf.Timestamp read_at = 3;
  google.protobuf.Timestamp reviewed_at = 4;
}

// Immutable server-attributed shared history; no private prepared messages or their changes. Absent/nonapplicable fields remain defaults.
message ThreadEvent {
  string id = 1;
  // Canonical lowercase non-nil UUID; all resource references must bind to this current workspace.
  string workspace_id = 2;
  string thread_id = 3;
  string actor_user_id = 4;
  ThreadEventKind kind = 5;
  google.protobuf.Timestamp occurred_at = 6;
  optional string message_id = 7;
  optional string previous_assignee_user_id = 8;
  optional string assignee_user_id = 9;
  ThreadState previous_state = 10;
  ThreadState state = 11;
  ClosureKind closure_kind = 12;
  // Close/reopen reason, <=1000 scalars/4000 bytes; nonblank for WITHOUT_VALIDATION or reopening.
  string reason = 13;
  // Monotonic per-thread causal order; independent of wall-clock time and UUIDs.
  int64 sequence = 14;
}

// Exactly one published message OR own prepared message, selected by the required inbox view.
// Waiting is chronological per directed user pair, never a semantic reply verdict.
message InboxItem {
  PublishedMessage message = 1;
  Thread thread = 2;
  PreparedMessage prepared_message = 3;
}

// Current authorized workspace aggregates; only own pending/prepared counts are private. No simulated metrics or unbounded project arrays.
message Overview {
  uint64 published_thread_count = 1;
  uint64 open_thread_count = 2;
  uint64 closed_thread_count = 4;
  uint64 assigned_active_thread_count = 5;
  uint64 pending_review_message_count = 6;
  uint64 unread_message_count = 7;
  uint64 own_pending_thread_count = 8;
  google.protobuf.Timestamp as_of = 9;
  // Current visible workspace projects, from the same overview snapshot.
  uint64 project_count = 10;
  // Exact count of caller InboxView AWAITING_REPLY items.
  uint64 awaiting_reply_message_count = 11;
  // Exact count of caller InboxView OWN_PREPARED, including later reply prepared messages.
  uint64 own_prepared_message_count = 12;
}

message ListProjectsRequest {
  // Canonical lowercase non-nil UUID; all resource references must bind to this current workspace.
  string workspace_id = 1;
  // Zero defaults to 25; explicit 1..100 only.
  int32 page_size = 2;
  // Opaque ASCII <=2048 bytes; binds actor/workspace/method/filters/limit, expires after 900 seconds.
  string page_token = 3;
}

message ListProjectsResponse {
  repeated Project projects = 1;
  // Empty at end; same opaque cursor policy as the request.
  string next_page_token = 2;
  // Older backends omit this flag. Empty-project deletion requires server support.
  bool supports_project_deletion = 3;
}

message GetProjectRequest {
  // Canonical lowercase non-nil UUID; all resource references must bind to this current workspace.
  string workspace_id = 1;
  string project_id = 2;
}

message GetProjectResponse {
  Project project = 1;
}

message CreateProjectRequest {
  // Canonical lowercase non-nil UUID; all resource references must bind to this current workspace.
  string workspace_id = 1;
  string name = 2;
  string description = 3;
  // Canonical UUID; retry key binds method/actor/workspace and exact canonical payload for resource lifetime.
  string request_id = 4;
}

message CreateProjectResponse {
  Project project = 1;
}

message UpdateProjectRequest {
  // Canonical lowercase non-nil UUID; all resource references must bind to this current workspace.
  string workspace_id = 1;
  string project_id = 2;
  string name = 3;
  string description = 4;
  // Required exact current resource revision; stale values fail Aborted without overwriting.
  string expected_revision = 5;
  // Canonical UUID; retry key binds method/actor/workspace and exact canonical payload for resource lifetime.
  string request_id = 6;
}

message UpdateProjectResponse {
  Project project = 1;
}

// Admin-only. Projects with any threads or team assignments cannot be deleted.
message DeleteProjectRequest {
  string workspace_id = 1;
  string project_id = 2;
  string expected_revision = 3;
  string request_id = 4;
}

message DeleteProjectResponse {}

message ListProjectTeamsRequest {
  // Canonical lowercase non-nil UUID; all resource references must bind to this current workspace.
  string workspace_id = 1;
  string project_id = 2;
  // Zero defaults to 25; explicit 1..100 only.
  int32 page_size = 3;
  // Opaque ASCII <=2048 bytes; binds actor/workspace/method/filters/limit, expires after 900 seconds.
  string page_token = 4;
}

message ListProjectTeamsResponse {
  repeated ProjectTeam project_teams = 1;
  // Empty at end; same opaque cursor policy as the request.
  string next_page_token = 2;
}

// Assigns a team to a project or replaces its exclusions (current ADMIN only).
// excluded_user_ids is the full exclusion list: distinct, at most 1000, and each
// user must be an active team member or an existing exclusion for this assignment.
// No exclusions means the project inherits all active members. expected_revision is empty when the team is not yet
// assigned and required (exact current revision) when replacing; stale values fail Aborted without overwriting.
message SetProjectTeamRequest {
  string workspace_id = 1;
  string project_id = 2;
  string team_id = 3;
  string expected_revision = 5;
  // Canonical UUID; retry key binds method/actor/workspace and exact payload for resource lifetime.
  string request_id = 6;
  repeated string excluded_user_ids = 7;
  // Must be true. Rejects clients that still send the former snapshot, even if empty.
  bool inherit_team_members = 8;
}

message SetProjectTeamResponse {
  ProjectTeam project_team = 1;
}

// Removes the team from the project (current ADMIN only). Threads and messages are untouched.
message RemoveProjectTeamRequest {
  string workspace_id = 1;
  string project_id = 2;
  string team_id = 3;
  string expected_revision = 4;
  string request_id = 5;
}

message RemoveProjectTeamResponse {}

// Explicit visibility required; PUBLISHED never includes prepared messages. OWN_PREPARED is creator-only. Empty query means no title search; state zero means any in that view.
message ListThreadsRequest {
  // Canonical lowercase non-nil UUID; all resource references must bind to this current workspace.
  string workspace_id = 1;
  optional string project_id = 2;
  ThreadState state = 4;
  optional string assignee_user_id = 5;
  // Exact literal case-sensitive substring of title, 0..120 scalars/480 bytes. No wildcards, ranking or Markdown search.
  string query = 6;
  ThreadVisibility visibility = 7;
  // Zero defaults to 25; explicit 1..100 only.
  int32 page_size = 8;
  // Opaque ASCII <=2048 bytes; binds actor/workspace/method/filters/limit, expires after 900 seconds.
  string page_token = 9;
}

message ListThreadsResponse {
  repeated Thread threads = 1;
  // Empty at end; same opaque cursor policy as the request.
  string next_page_token = 2;
}

message GetThreadRequest {
  // Canonical lowercase non-nil UUID; all resource references must bind to this current workspace.
  string workspace_id = 1;
  string thread_id = 2;
}

message GetThreadResponse {
  Thread thread = 1;
}

// Creates a private thread and its single initial prepared message atomically. Required recipient is explicit; the recipient is never inferred from a project team.
message CreateThreadRequest {
  // Canonical lowercase non-nil UUID; all resource references must bind to this current workspace.
  string workspace_id = 1;
  string project_id = 2;
  string title = 4;
  // Exactly one explicit application user UUID; must be an active enabled member at save/publication.
  string recipient_user_id = 6;
  // UI label Resumen. Prepared: 0..2000 scalars/8000 bytes; publication requires nonblank. Preserve exact UTF-8.
  string summary = 7;
  // Free-form Markdown, 0..65536 UTF-8 bytes in prepared messages; publication requires nonblank. Preserve exact bytes, no template/normalization.
  string context_markdown = 8;
  // Canonical UUID; retry key binds method/actor/workspace and exact canonical payload for resource lifetime.
  string request_id = 9;
}

// Author-private even on retry. After publication/discard, creation retry fails FailedPrecondition rather than returning consumed private content.
message CreateThreadResponse {
  Thread thread = 1;
  PreparedMessage initial_prepared_message = 2;
}

// Full replacement of title only. The project is immutable; Pending creator-only; open creator/admin.
message UpdateThreadRequest {
  // Canonical lowercase non-nil UUID; all resource references must bind to this current workspace.
  string workspace_id = 1;
  string thread_id = 2;
  string title = 3;
  // Required exact current resource revision; stale values fail Aborted without overwriting.
  string expected_revision = 5;
  // Canonical UUID; retry key binds method/actor/workspace and exact canonical payload for resource lifetime.
  string request_id = 6;
}

message UpdateThreadResponse {
  Thread thread = 1;
}

// Explicit assignment of a published nonclosed thread by creator/admin. Does not rewrite any message recipient.
message AssignThreadRequest {
  // Canonical lowercase non-nil UUID; all resource references must bind to this current workspace.
  string workspace_id = 1;
  string thread_id = 2;
  string assignee_user_id = 3;
  // Required exact current resource revision; stale values fail Aborted without overwriting.
  string expected_revision = 4;
  // Canonical UUID; retry key binds method/actor/workspace and exact canonical payload for resource lifetime.
  string request_id = 5;
}

message AssignThreadResponse {
  Thread thread = 1;
}



// Creator/admin only. WITHOUT_VALIDATION requires a reason. Always requires current thread revision.
message CloseThreadRequest {
  // Canonical lowercase non-nil UUID; all resource references must bind to this current workspace.
  string workspace_id = 1;
  string thread_id = 2;
  ClosureKind kind = 3;
  // Close/reopen reason, <=1000 scalars/4000 bytes; nonblank for WITHOUT_VALIDATION or reopening.
  string reason = 4;
  // Required exact current resource revision; stale values fail Aborted without overwriting.
  string expected_revision = 5;
  // Canonical UUID; retry key binds method/actor/workspace and exact canonical payload for resource lifetime.
  string request_id = 6;
}

message CloseThreadResponse {
  Thread thread = 1;
}

// CLOSED to OPEN by creator/admin, with nonblank reason; clears current proposal/closure projection, preserves events.
message ReopenThreadRequest {
  // Canonical lowercase non-nil UUID; all resource references must bind to this current workspace.
  string workspace_id = 1;
  string thread_id = 2;
  // Close/reopen reason, <=1000 scalars/4000 bytes; nonblank for WITHOUT_VALIDATION or reopening.
  string reason = 3;
  // Required exact current resource revision; stale values fail Aborted without overwriting.
  string expected_revision = 4;
  // Canonical UUID; retry key binds method/actor/workspace and exact canonical payload for resource lifetime.
  string request_id = 5;
}

message ReopenThreadResponse {
  Thread thread = 1;
}

// Explicit view required. PUBLISHED returns only messages; OWN_PREPARED only caller prepared messages. No mixed visibility pages.
message ListMessagesRequest {
  // Canonical lowercase non-nil UUID; all resource references must bind to this current workspace.
  string workspace_id = 1;
  string thread_id = 2;
  MessageView view = 3;
  // Zero defaults to 25; explicit 1..100 only.
  int32 page_size = 4;
  // Opaque ASCII <=2048 bytes; binds actor/workspace/method/filters/limit, expires after 900 seconds.
  string page_token = 5;
  // Page published messages from newest to oldest. Applies only to the published view.
  bool newest_first = 6;
}

message ListMessagesResponse {
  repeated PublishedMessage messages = 1;
  repeated PreparedMessage prepared_messages = 2;
  // Empty at end; same opaque cursor policy as the request.
  string next_page_token = 3;
}

// Absent prepared_message_id and expected_prepared_message_revision creates a new prepared message on an open thread; both present updates the author's prepared message. Tokens bind exact content.
message SavePreparedMessageRequest {
  // Canonical lowercase non-nil UUID; all resource references must bind to this current workspace.
  string workspace_id = 1;
  string thread_id = 2;
  optional string prepared_message_id = 3;
  // Exactly one explicit application user UUID; must be an active enabled member at save/publication.
  string recipient_user_id = 4;
  // UI label Resumen. Prepared: 0..2000 scalars/8000 bytes; publication requires nonblank. Preserve exact UTF-8.
  string summary = 5;
  // Free-form Markdown, 0..65536 UTF-8 bytes in prepared messages; publication requires nonblank. Preserve exact bytes, no template/normalization.
  string context_markdown = 6;
  // Exact prepared message revision; absent only on prepared-message creation.
  optional string expected_prepared_message_revision = 7;
  // Required exact thread revision; a new publication invalidates stale lifecycle/publication operations.
  string expected_thread_revision = 8;
  // Canonical UUID; retry key binds method/actor/workspace and exact canonical payload for resource lifetime.
  string request_id = 9;
}

message SavePreparedMessageResponse {
  PreparedMessage prepared_message = 1;
  // Current thread token; changing the initial recipient advances it atomically.
  Thread thread = 2;
}

// Publishes the persisted exact prepared message using both opaque revisions. First publication opens the pending thread and publishes its message atomically and assigns its exact recipient.
message PublishMessageRequest {
  // Canonical lowercase non-nil UUID; all resource references must bind to this current workspace.
  string workspace_id = 1;
  string thread_id = 2;
  string prepared_message_id = 3;
  // Exact prepared message revision; absent only on prepared-message creation.
  string expected_prepared_message_revision = 4;
  // Required exact thread revision; a new publication invalidates stale lifecycle/publication operations.
  string expected_thread_revision = 5;
  // Canonical UUID; retry key binds method/actor/workspace and exact canonical payload for resource lifetime.
  string request_id = 6;
}

// Published content is immutable; later publication preserves nonclosed lifecycle state and advances thread revision.
message PublishMessageResponse {
  Thread thread = 1;
  PublishedMessage message = 2;
}

// Author-only. Discarding the initial prepared message also discards its still-private thread atomically. Never deletes published content.
message DiscardPreparedMessageRequest {
  // Canonical lowercase non-nil UUID; all resource references must bind to this current workspace.
  string workspace_id = 1;
  string thread_id = 2;
  string prepared_message_id = 3;
  // Exact prepared message revision; absent only on prepared-message creation.
  string expected_prepared_message_revision = 4;
  // Required exact thread revision; a new publication invalidates stale lifecycle/publication operations.
  string expected_thread_revision = 5;
  // Canonical UUID; retry key binds method/actor/workspace and exact canonical payload for resource lifetime.
  string request_id = 6;
}

message DiscardPreparedMessageResponse {
  string prepared_message_id = 1;
  bool thread_discarded = 2;
}

// Only exact authenticated message recipient; immutable message ID is the concurrency identity. A repeated read keeps its original timestamp.
message MarkReadRequest {
  // Canonical lowercase non-nil UUID; all resource references must bind to this current workspace.
  string workspace_id = 1;
  string thread_id = 2;
  string message_id = 3;
  // Canonical UUID; retry key binds method/actor/workspace and exact canonical payload for resource lifetime.
  string request_id = 4;
}

message MarkReadResponse {
  RecipientReceipt receipt = 1;
}

// Only exact authenticated message recipient with existing read; cannot affect another message, thread lifecycle or recipient.
message MarkReviewedRequest {
  // Canonical lowercase non-nil UUID; all resource references must bind to this current workspace.
  string workspace_id = 1;
  string thread_id = 2;
  string message_id = 3;
  // Canonical UUID; retry key binds method/actor/workspace and exact canonical payload for resource lifetime.
  string request_id = 4;
}

message MarkReviewedResponse {
  RecipientReceipt receipt = 1;
}

message ListInboxItemsRequest {
  // Canonical lowercase non-nil UUID; all resource references must bind to this current workspace.
  string workspace_id = 1;
  // Zero defaults to 25; explicit 1..100 only.
  int32 page_size = 2;
  // Opaque ASCII <=2048 bytes; binds actor/workspace/method/filters/limit, expires after 900 seconds.
  string page_token = 3;
  // Required explicit view; cursor binds it and the implicit actor.
  InboxView view = 4;
}

message ListInboxItemsResponse {
  repeated InboxItem items = 1;
  // Empty at end; same opaque cursor policy as the request.
  string next_page_token = 2;
}

// Published history only; owner of a pending thread gets an empty page. Other actors receive NotFound.
message ListThreadEventsRequest {
  // Canonical lowercase non-nil UUID; all resource references must bind to this current workspace.
  string workspace_id = 1;
  string thread_id = 2;
  // Zero defaults to 25; explicit 1..100 only.
  int32 page_size = 3;
  // Opaque ASCII <=2048 bytes; binds actor/workspace/method/filters/limit, expires after 900 seconds.
  string page_token = 4;
  // Page events from newest to oldest.
  bool newest_first = 5;
}

message ListThreadEventsResponse {
  repeated ThreadEvent events = 1;
  // Empty at end; same opaque cursor policy as the request.
  string next_page_token = 2;
}

message GetOverviewRequest {
  // Canonical lowercase non-nil UUID; all resource references must bind to this current workspace.
  string workspace_id = 1;
}

message GetOverviewResponse {
  Overview overview = 1;
}
